name: Build Android APK
# Works with the files uploaded flat (all in the main folder). Run from the Actions tab: Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Put the web files into the www folder
        run: |
          mkdir -p www
          cp index.html data.js htm.umd.js react.production.min.js react-dom.production.min.js www/
          ls -la www
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MLC-Ward-wise-List-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
